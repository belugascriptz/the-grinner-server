<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>The Grinner VR</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div class="brand">THE GRINNER <span>VR</span></div>
    <div id="status">Starting game…</div>
    <div id="room">ROOM: connecting…</div>
    <div class="buttons">
      <button id="enterVR" type="button">ENTER VR</button>
      <button id="voteForest" type="button">Vote Forest</button>
      <button id="voteCaves" type="button">Vote Caves</button>
      <button id="voteFacility" type="button">Vote Facility</button>
    </div>
    <div id="notice">Open this page in Meta Quest Browser, then press ENTER VR.</div>
  </div>
  <script type="module" src="/game.js"></script>
</body>
</html>
